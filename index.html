<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#fff0f5" />
<title>오늘 뭐 먹지? 💗</title>
<style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#533345;background:#fff7fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 8%,#ffe1ed 0,transparent 33%),linear-gradient(155deg,#fff7fa,#fff1f7)}.app{max-width:730px;margin:auto;padding:38px 18px 60px}.heading{text-align:center}.eyebrow{color:#d65b90;font-weight:800;letter-spacing:.08em;font-size:12px}.heading h1{font-size:clamp(31px,6vw,47px);letter-spacing:-.06em;margin:12px 0 8px}.heading p{font-size:15px;color:#99788a;margin:0 0 24px}.panel{background:#fff;border:1px solid #fbdde9;border-radius:28px;padding:24px;box-shadow:0 15px 50px #e4719a19}.display{text-align:center;position:relative;min-height:244px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#fff0f6,#fff9fc);border:1px dashed #f4afcb;border-radius:22px;overflow:hidden}.display::before,.display::after{content:'✦';position:absolute;color:#f5a2c4;font-size:23px}.display::before{left:13%;top:21%}.display::after{right:12%;bottom:19%}.emoji{font-size:76px;line-height:1.25;filter:drop-shadow(0 8px 9px #a5446920)}.result-title{font-size:clamp(27px,6vw,37px);font-weight:900;letter-spacing:-.05em;margin:8px 0 4px}.subtext{color:#a47d91;font-size:14px}.roll .emoji{animation:wobble .17s infinite alternate}.reveal .emoji{animation:pop .52s cubic-bezier(.22,1.4,.36,1)}.reveal .result-title{animation:rise .45s ease both}@keyframes wobble{from{transform:rotate(-10deg) scale(.9)}to{transform:rotate(10deg) scale(1.05)}}@keyframes pop{0%{transform:scale(.3) rotate(-20deg)}70%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1)}}@keyframes rise{from{opacity:.3;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.primary{display:block;width:100%;border:0;border-radius:16px;background:linear-gradient(90deg,#f05c9b,#ed7bad);font-size:18px;font-weight:850;color:white;min-height:58px;margin:18px 0 0;box-shadow:0 9px 18px #ed6ca14d;cursor:pointer}.primary:disabled{opacity:.6;cursor:wait}.controls{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:13px}.sound{border:0;background:transparent;color:#986e83;font-size:13px;cursor:pointer;padding:9px}.section{margin-top:28px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.section h2{font-size:19px;letter-spacing:-.04em;margin:0}.count{background:#ffe2ed;border-radius:30px;padding:7px 12px;font-size:13px;font-weight:800;color:#d45387}.add{display:flex;gap:9px}.add input{min-width:0;flex:1;border:1px solid #f0cade;border-radius:15px;padding:15px;font-size:16px;outline:none;color:#533345}.add input:focus{border-color:#ef75a8;box-shadow:0 0 0 3px #fce0eb}.add button{border:0;background:#59394a;color:white;font-weight:800;border-radius:15px;padding:0 20px;font-size:15px;cursor:pointer}.hint{min-height:20px;color:#d95178;font-size:13px;margin:9px 2px 0}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{border:1px solid #f9dbe7;border-radius:16px;background:#fff;padding:17px 10px;text-align:center;position:relative;min-height:98px}.card .food{font-size:29px}.card .name{font-size:14px;font-weight:750;margin-top:5px;overflow-wrap:anywhere}.card button{position:absolute;right:5px;top:4px;background:none;border:0;color:#c995ae;font-size:17px;cursor:pointer;padding:5px;line-height:1}.card button:hover{color:#dc437d}.footer{text-align:center;color:#ae8a9a;font-size:12px;margin-top:25px}@media(max-width:440px){.app{padding:25px 13px 40px}.panel{padding:15px;border-radius:23px}.display{min-height:220px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.add button{padding:0 14px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app">
 <header class="heading"><div class="eyebrow">TODAY'S PICK ✦</div><h1>오늘 뭐 먹지? 💗</h1><p>고민은 짧게, 맛있는 선택은 즐겁게!</p></header>
 <section class="panel" aria-label="메뉴 추첨"><div class="display" id="display" aria-live="polite"><div class="emoji" id="emoji">🍽️</div><div class="result-title" id="picked">오늘의 메뉴는?</div><div class="subtext" id="subtitle">버튼을 눌러 운명의 메뉴를 만나보세요!</div></div><button class="primary" id="draw">💖 메뉴 뽑기</button><div class="controls"><button class="sound" id="sound" aria-pressed="true">🔊 효과음 켜짐</button></div></section>
 <section class="section"><div class="section-head"><h2>➕ 메뉴 직접 추가하기</h2></div><form class="add" id="addForm"><input id="newMenu" maxlength="30" placeholder="예: 떡볶이, 초밥, 샐러드" aria-label="추가할 메뉴명" autocomplete="off"/><button type="submit">추가하기</button></form><div class="hint" id="notice" role="status"></div></section>
 <section class="section"><div class="section-head"><h2>🍴 추첨 후보 메뉴</h2><span class="count" id="count">6개 메뉴</span></div><div class="cards" id="cards"></div></section>
 <div class="footer">오늘도 맛있는 하루 보내세요! 🌷</div>
</main>
<script>
(()=>{'use strict';
const initial=[{name:'김치찌개',emoji:'🍲'},{name:'된장찌개',emoji:'🥘'},{name:'비빔밥',emoji:'🍚'},{name:'돈까스',emoji:'🍛'},{name:'파스타',emoji:'🍝'},{name:'제육볶음',emoji:'🥩'}];
const emojiMap={'떡볶이':'🍢','초밥':'🍣','샐러드':'🥗','피자':'🍕','햄버거':'🍔','치킨':'🍗','라면':'🍜','우동':'🍜','쌀국수':'🍜','김밥':'🍙','카레':'🍛','삼겹살':'🥓','스테이크':'🥩','짜장면':'🍜','짬뽕':'🍜','국밥':'🍲','샌드위치':'🥪','냉면':'🍜','족발':'🍖'};
let menus;try{const saved=JSON.parse(localStorage.getItem('today-menu-list-v1'));menus=Array.isArray(saved)&&saved.length?saved.filter(x=>x&&typeof x.name==='string'&&typeof x.emoji==='string').slice(0,100):initial.slice();if(!menus.length)menus=initial.slice()}catch{menus=initial.slice()}
let chosen=null,rolling=false,soundOn=true,audioCtx=null;
const $=id=>document.getElementById(id),cards=$('cards'),display=$('display'),draw=$('draw'),notice=$('notice');
function save(){try{localStorage.setItem('today-menu-list-v1',JSON.stringify(menus))}catch{}}
function message(txt){notice.textContent=txt}
function render(){cards.replaceChildren();menus.forEach((item,index)=>{const el=document.createElement('div');el.className='card';const food=document.createElement('div');food.className='food';food.textContent=item.emoji;const name=document.createElement('div');name.className='name';name.textContent=item.name;const del=document.createElement('button');del.type='button';del.textContent='×';del.setAttribute('aria-label',`${item.name} 삭제`);del.addEventListener('click',()=>{if(rolling)return;menus.splice(index,1);save();render();message(`${item.name} 메뉴를 삭제했어요.`)});el.append(food,name,del);cards.append(el)});$('count').textContent=`${menus.length}개 메뉴`;draw.disabled=rolling||menus.length===0;if(!menus.length)message('후보가 없어요. 메뉴를 먼저 추가해 주세요!')}
function blip(freq=650,duration=.055){if(!soundOn)return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioCtx=audioCtx||new Audio();if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,audioCtx.currentTime);gain.gain.setValueAtTime(.045,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);osc.connect(gain).connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+duration)}catch{}}
const confetti=()=>{if(!soundOn)return;[530,660,790].forEach((f,i)=>setTimeout(()=>blip(f,.11),i*100))};
function show(item,subtitle){$('emoji').textContent=item.emoji;$('picked').textContent=item.name;$('subtitle').textContent=subtitle}
function pick(){if(rolling)return;if(!menus.length){message('메뉴를 먼저 추가해 주세요!');return}rolling=true;draw.disabled=true;draw.textContent='💗 두근두근 뽑는 중...';display.className='display roll';let tick=0;const interval=setInterval(()=>{const item=menus[Math.floor(Math.random()*menus.length)];show(item,'어떤 메뉴가 뽑힐까요?');if(++tick%2===0)blip(450+tick*20,.035)},75);setTimeout(()=>{clearInterval(interval);const item=menus[Math.floor(Math.random()*menus.length)];chosen=item;show(item,'✨ 오늘은 이 메뉴 어떠세요? 맛있게 드세요!');display.className='display reveal';draw.textContent='🔄 다시 뽑기';rolling=false;draw.disabled=false;confetti()},1350)}
draw.addEventListener('click',pick);
$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 효과음 켜짐':'🔇 효과음 꺼짐';$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)blip()});
$('addForm').addEventListener('submit',e=>{e.preventDefault();const input=$('newMenu'),name=input.value.trim().replace(/\s+/g,' ');if(!name){message('추가할 메뉴명을 입력해 주세요.');input.focus();return}if(menus.some(x=>x.name.toLocaleLowerCase('ko')===name.toLocaleLowerCase('ko'))){message(`⚠️ '${name}'은(는) 이미 후보에 있어요!`);input.focus();return}if(menus.length>=100){message('메뉴는 최대 100개까지 추가할 수 있어요.');return}menus.push({name,emoji:emojiMap[name]||'🍽️'});save();render();input.value='';message(`💖 '${name}' 메뉴가 추가되었어요!`)});
render();
})();
</script>
</body>
</html>
